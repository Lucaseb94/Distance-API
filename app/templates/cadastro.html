<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta | Distance API</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-panel" aria-label="Cadastro">
        <header class="auth-header">
          <a class="brand auth-brand" href="{{ url_for('main.index') }}">
            <span class="brand-mark" aria-hidden="true"></span>
            <span>Distance API</span>
          </a>
          <h1>Criar conta</h1>
        </header>

        <form class="auth-form" data-auth-form data-auth-endpoint="/api/auth/cadastro">
          <label for="nome">Nome</label>
          <input
            id="nome"
            name="nome"
            type="text"
            autocomplete="name"
            placeholder="Seu nome"
            required
          >

          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="voce@email.com"
            required
          >

          <label for="senha">Senha</label>
          <input
            id="senha"
            name="senha"
            type="password"
            autocomplete="new-password"
            placeholder="Crie uma senha"
            minlength="6"
            required
          >

          <label for="confirmar-senha">Confirmar senha</label>
          <input
            id="confirmar-senha"
            name="confirmar_senha"
            type="password"
            autocomplete="new-password"
            placeholder="Repita a senha"
            minlength="6"
            required
          >

          <div class="form-row">
            <span></span>
            <a href="{{ url_for('main.login') }}">Ja tenho conta</a>
          </div>

          <button type="submit">Criar conta</button>
        </form>

        <p class="auth-note" data-auth-message></p>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  </body>
</html>
